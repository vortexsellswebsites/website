<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. DoneRite's Yard Sale</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    body {
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .poster {
      background: linear-gradient(180deg, #e8f0fe 0%, #ffffff 100%);
      width: 100%;
      max-width: 450px;
      border: 8px solid #1a2a6c;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      overflow: hidden;
      text-align: center;
      position: relative;
    }

    .header {
      background-color: #1b365d;
      color: #ffffff;
      padding: 15px 10px;
    }

    .header h2 {
      font-size: 1.2rem;
      color: #f39c12;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header h1 {
      font-size: 2.8rem;
      color: #e74c3c;
      text-shadow: 2px 2px 0px #ffffff, 4px 4px 0px #000;
      margin-top: -5px;
      text-transform: uppercase;
    }

    .main-board {
      background-color: #fff8eb;
      border: 4px solid #8e44ad;
      margin: 15px;
      padding: 15px;
      border-radius: 8px;
    }

    .join-us {
      color: #27ae60;
      font-size: 1.4rem;
      text-transform: uppercase;
    }

    .date {
      color: #c0392b;
      font-size: 2rem;
      margin: 5px 0;
    }

    .time-badge {
      background-color: #2980b9;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .location {
      color: #333333;
      font-size: 0.95rem;
      margin-bottom: 15px;
      font-family: Arial, sans-serif;
    }

    .items-list {
      list-style: none;
      text-align: left;
      max-width: 260px;
      margin: 0 auto;
      font-family: Arial, sans-serif;
      font-weight: bold;
      color: #2c3e50;
    }

    .items-list li {
      padding: 4px 0;
      border-bottom: 1px dashed #cccccc;
    }

    .items-list li::before {
      content: "✔ ";
      color: #27ae60;
    }

    .side-banner {
      background-color: #f1c40f;
      color: #d35400;
      padding: 10px;
      margin: 10px 15px;
      border-radius: 6px;
      font-size: 1.1rem;
      text-transform: uppercase;
    }

    .footer {
      background-color: #1b365d;
      color: #ffffff;
      padding: 12px;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="poster">
    <div class="header">
      <h2>Mr. DoneRite's</h2>
      <h1>Yard Sale!</h1>
    </div>

    <div class="main-board">
      <div class="join-us">★ JOIN US! ★</div>
      <div class="date">SEPTEMBER 12<sup>TH</sup> & 13<sup>TH</sup></div>
      <div class="time-badge">8:00 AM – 2:00 PM</div>
      
      <div class="location">
        📍 <strong>190 CENTER ST., MIDDLEBORO</strong><br>
        <small>(FOLLOW THE SIGNS!)</small>
      </div>

      <ul class="items-list">
        <li>CLOTHES</li>
        <li>TOYS</li>
        <li>TOOLS</li>
        <li>SPORTS EQUIPMENT</li>
        <li>HOUSEHOLD GOODS</li>
        <li>DECORATIONS</li>
      </ul>
    </div>

    <div class="side-banner">
      🍋 LEMONADE STAND! 🍋
    </div>

    <div class="footer">
      SHOP ★ SUPPORT ★ HAVE FUN!
    </div>
  </div>

</body>
</html>
