<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>128 Newbury - Resale Shop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .flyer {
      width: 100vw;
      height: 100vh;
      max-width: 500px;
      max-height: 900px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    }

    .header {
      text-align: center;
      background: #2563eb;
      padding: 12px 8px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      line-height: 1;
    }

    .header p {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fef08a;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
      flex-grow: 1;
      min-height: 0;
    }

    .img-box {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-box span {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      padding: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
    }

    .info-card p {
      font-size: 0.85rem;
      line-height: 1.35;
      color: #cbd5e1;
    }

    .highlights {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      background: #334155;
      color: #38bdf8;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .footer {
      background: #e11d48;
      color: #ffffff;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="flyer">
    <div class="header">
      <h1>128 NEWBURY</h1>
      <p>Something Different Every Time</p>
    </div>

    <div class="image-grid">
      <div class="img-box">
        <img src="https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=400&q=80" alt="Clothing">
        <span>Clothing & Shoes</span>
      </div>
      <div class="img-box">
        <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=400&q=80" alt="Furniture">
        <span>Furniture</span>
      </div>
      <div class="img-box">
        <img src="https://images.unsplash.com/photo-1526738549149-8e07eca6c147?auto=format&fit=crop&w=400&q=80" alt="Electronics">
        <span>Electronics</span>
      </div>
      <div class="img-box">
        <img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=400&q=80" alt="Home Decor">
        <span>Decor & Finds</span>
      </div>
    </div>

    <div class="info-card">
      <p>Clothing, shoes, furniture, electronics, household goods, decor, toys, and unexpected finds.</p>
      <div class="highlights">
        <span class="tag">New Arrivals</span>
        <span class="tag">Great Deals</span>
        <span class="tag">Local Shop</span>
      </div>
    </div>

    <div class="footer">
      📍 VISIT US AT 128 NEWBURY TODAY!
    </div>
  </div>

</body>
</html>
