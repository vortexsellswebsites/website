<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAMPION. Yard Sale</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #08783e;
}

.poster {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  color: white;
  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.12),
      rgba(0,70,35,.25)
    ),
    url("https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=2000&q=90")
    center / cover;
}

/* dark green overlay */

.poster::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      180deg,
      rgba(0,70,35,.72) 0%,
      rgba(0,100,50,.25) 42%,
      rgba(0,35,18,.82) 100%
    );
}

/* top */

.top {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 28px 6%;
}

.logo {
  font-size: clamp(30px, 5vw, 58px);
  font-weight: 1000;
  letter-spacing: -3px;
}

.tag {
  background: white;
  color: #08783e;
  padding: 12px 20px;
  font-size: 15px;
  font-weight: 900;
  border-radius: 30px;
}

/* main poster */

.content {
  position: relative;
  z-index: 2;
  min-height: calc(100vh - 100px);
  padding: 4vh 6% 6vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* small heading */

.eyebrow {
  font-size: clamp(15px, 2vw, 24px);
  font-weight: 900;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 15px;
}

/* giant text */

h1 {
  font-size: clamp(75px, 15vw, 190px);
  line-height: .76;
  letter-spacing: -11px;
  font-weight: 1000;
  max-width: 1000px;
  text-transform: uppercase;
}

h1 span {
  display: block;
}

/* green/white poster badge */

.badge {
  margin-top: 35px;
  width: fit-content;
  background: #fff;
  color: #08783e;
  padding: 12px 24px;
  font-size: clamp(18px, 2.5vw, 30px);
  font-weight: 1000;
  transform: rotate(-2deg);
}

/* description */

.description {
  max-width: 650px;
  margin-top: 30px;
  font-size: clamp(18px, 2.5vw, 29px);
  line-height: 1.25;
  font-weight: 700;
}

/* bottom information */

.bottom {
  position: relative;
  z-index: 2;
  margin-top: 35px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  max-width: 1000px;
  border-top: 2px solid rgba(255,255,255,.8);
  padding-top: 22px;
}

.info {
  padding-right: 25px;
}

.info + .info {
  border-left: 1px solid rgba(255,255,255,.5);
  padding-left: 25px;
}

.info-title {
  font-size: 13px;
  letter-spacing: 3px;
  font-weight: 900;
  margin-bottom: 8px;
}

.info-text {
  font-size: clamp(17px, 2vw, 23px);
  font-weight: 900;
  line-height: 1.15;
}

/* mobile */

@media (max-width: 650px) {

  .poster {
    min-height: 100svh;
  }

  .top {
    padding: 22px 5%;
  }

  .logo {
    font-size: 31px;
  }

  .tag {
    font-size: 12px;
    padding: 10px 14px;
  }

  .content {
    padding: 35px 5% 45px;
    justify-content: center;
  }

  .eyebrow {
    letter-spacing: 3px;
    font-size: 14px;
  }

  h1 {
    font-size: clamp(70px, 19vw, 125px);
    letter-spacing: -7px;
  }

  .badge {
    margin-top: 25px;
    font-size: 18px;
  }

  .description {
    font-size: 19px;
    margin-top: 23px;
  }

  .bottom {
    grid-template-columns: 1fr;
    gap: 18px;
    margin-top: 30px;
  }

  .info {
    padding-right: 0;
  }

  .info + .info {
    border-left: 0;
    border-top: 1px solid rgba(255,255,255,.4);
    padding-left: 0;
    padding-top: 18px;
  }
}
</style>
</head>

<body>

<main class="poster">

  <div class="top">
    <div class="logo">CHAMPION.</div>
    <div class="tag">LOCAL YARD SALE</div>
  </div>

  <div class="content">

    <div class="eyebrow">
      GOOD FINDS · GOOD DEALS
    </div>

    <h1>
      YARD
      <span>SALE.</span>
    </h1>

    <div class="badge">
      CLOTHES · RANDOM ITEMS · MORE
    </div>

    <p class="description">
      Come take a look and discover clothes,
      household items, random finds, and
      unexpected treasures at great prices.
    </p>

    <div class="bottom">

      <div class="info">
        <div class="info-title">NEXT SALE</div>
        <div class="info-text">
          SATURDAY & SUNDAY
        </div>
      </div>

      <div class="info">
        <div class="info-title">HOURS</div>
        <div class="info-text">
          9 AM — 2 PM
        </div>
      </div>

      <div class="info">
        <div class="info-title">LOCATION</div>
        <div class="info-text">
          128 NEWBURY ST
        </div>
      </div>

    </div>

  </div>

</main>

</body>
</html>
