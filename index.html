<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CHAMPION. Yard Sale</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#176b3a;
}

.poster{
  width:100vw;
  height:100vh;
  overflow:hidden;
  position:relative;
  background:
    linear-gradient(rgba(255,244,210,.18),rgba(0,70,30,.15)),
    url("https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=1800&q=85")
    center/cover;
}

/* OLD POSTER TEXTURE */

.poster:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:rgba(255,255,255,.08);
}

/* TOP */

.header{
  position:relative;
  z-index:2;
  height:12%;
  background:#f7edcf;
  border-bottom:7px solid #173b91;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.logo{
  color:#173b91;
  font-size:clamp(25px,5vw,65px);
  font-weight:1000;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* MAIN POSTER */

.main{
  position:relative;
  z-index:2;
  height:88%;
  padding:2vh 4vw;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:2vw;
  background:
    linear-gradient(135deg,#f8edcf 0%,#fff7dc 55%,#e9dfb8 100%);
}

/* LEFT */

.left{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
}

.small{
  color:#d72b24;
  font-weight:1000;
  font-size:clamp(11px,1.5vw,20px);
  letter-spacing:3px;
  text-transform:uppercase;
}

h1{
  color:#183c93;
  font-size:clamp(65px,10vw,155px);
  line-height:.78;
  font-weight:1000;
  text-transform:uppercase;
  letter-spacing:-7px;
  text-shadow:5px 5px 0 #d92723;
  margin:1vh 0 2vh;
}

.sale{
  color:#d92723;
}

.sub{
  background:#183c93;
  color:white;
  display:inline-block;
  width:max-content;
  padding:8px 16px;
  font-size:clamp(12px,1.5vw,21px);
  font-weight:1000;
  text-transform:uppercase;
  transform:rotate(-2deg);
}

.description{
  color:#222;
  font-weight:700;
  font-size:clamp(13px,1.5vw,22px);
  max-width:600px;
  line-height:1.25;
  margin-top:2vh;
}

/* RIGHT */

.right{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.character{
  width:58%;
  max-height:65%;
  object-fit:cover;
  border:8px solid #183c93;
  border-radius:35px;
  box-shadow:10px 10px 0 #d92723;
}

/* INFO CARD */

.info{
  position:absolute;
  bottom:3%;
  left:4%;
  width:92%;
  background:#fff4d2;
  border:6px solid #183c93;
  padding:12px;
  text-align:center;
  box-shadow:7px 7px 0 #d92723;
}

.date{
  color:#d92723;
  font-size:clamp(19px,2.7vw,40px);
  font-weight:1000;
  text-transform:uppercase;
}

.time{
  color:#183c93;
  font-size:clamp(15px,2vw,28px);
  font-weight:1000;
  margin-top:3px;
}

.address{
  color:#111;
  font-size:clamp(12px,1.4vw,20px);
  font-weight:900;
  margin-top:5px;
}

/* ITEM STRIP */

.items{
  position:absolute;
  z-index:5;
  bottom:2%;
  right:4%;
  width:44%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.item{
  background:white;
  border:4px solid #183c93;
  transform:rotate(var(--r));
}

.item img{
  display:block;
  width:100%;
  height:clamp(55px,8vh,100px);
  object-fit:cover;
}

.item span{
  display:block;
  color:#183c93;
  font-size:clamp(8px,1vw,13px);
  font-weight:1000;
  text-align:center;
  padding:4px;
  text-transform:uppercase;
}

/* MOBILE */

@media(max-width:700px){

  .header{
    height:9%;
    border-bottom:4px solid #173b91;
  }

  .main{
    height:91%;
    display:block;
    padding:2vh 5vw;
  }

  .left{
    height:56%;
    justify-content:center;
  }

  h1{
    font-size:clamp(58px,18vw,100px);
    letter-spacing:-5px;
    margin:1vh 0;
  }

  .description{
    font-size:13px;
    max-width:95%;
    margin-top:10px;
  }

  .right{
    height:44%;
  }

  .character{
    width:48%;
    max-height:75%;
    border-width:5px;
    border-radius:22px;
    box-shadow:6px 6px 0 #d92723;
  }

  .info{
    left:0;
    bottom:0;
    width:52%;
    padding:7px;
    border-width:4px;
    box-shadow:4px 4px 0 #d92723;
  }

  .items{
    right:0;
    bottom:0;
    width:44%;
    gap:4px;
  }

  .item{
    border-width:2px;
  }

  .item img{
    height:52px;
  }

  .item span{
    font-size:7px;
    padding:2px;
  }
}
</style>
</head>

<body>

<div class="poster">

  <header class="header">
    <div class="logo">CHAMPION.</div>
  </header>

  <main class="main">

    <div class="left">

      <div class="small">
        Good Finds • Good Deals
      </div>

      <h1>
        YARD<br>
        <span class="sale">SALE!</span>
      </h1>

      <div class="sub">
        Lots of great items for sale
      </div>

      <p class="description">
        Come check out clothes, shoes,
        household goods, home decor,
        electronics and plenty of random
        finds.
      </p>

    </div>


    <div class="right">

      <img
        class="character"
        src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=85"
        alt="Yard sale items"
      >

      <div class="info">

        <div class="date">
          NEXT SALE
        </div>

        <div class="time">
          SATURDAY & SUNDAY · 9 AM – 2 PM
        </div>

        <div class="address">
          128 NEWBURY ST
        </div>

      </div>


      <div class="items">

        <div class="item" style="--r:-3deg">
          <img src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=500&q=80">
          <span>Clothes</span>
        </div>

        <div class="item" style="--r:2deg">
          <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80">
          <span>Shoes</span>
        </div>

        <div class="item" style="--r:-2deg">
          <img src="https://images.unsplash.com/photo-1618220179428-22790b461013?auto=format&fit=crop&w=500&q=80">
          <span>Decor</span>
        </div>

        <div class="item" style="--r:3deg">
          <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=500&q=80">
          <span>Electronics</span>
        </div>

      </div>

    </div>

  </main>

</div>

</body>
</html>
